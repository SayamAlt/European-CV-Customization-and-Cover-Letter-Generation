<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CV Customizer — Setup</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 420px;
      margin: 32px auto;
      padding: 0 16px;
      color: #1a1a1a;
    }
    h2 { font-size: 16px; margin-bottom: 4px; }
    p.hint { font-size: 12px; color: #666; margin-top: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 16px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>CV Customizer — Setup</h2>
  <p class="hint">Stored only in this browser (chrome.storage.local), never in extension source.</p>

  <label for="apiKey">Backend API Key</label>
  <input type="password" id="apiKey" placeholder="Paste your API_SECRET_KEY value">

  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="https://your-backend-url">

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
